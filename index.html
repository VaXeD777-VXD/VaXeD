<script>
(function(){

var KEY='vaxed_kolichub_final';
var admin=false;

var NAV=[
['home','🏠 Ana Sayfa'],
['purchases','🎁 Satın Alımlar'],
['night','🌙 Gece Pazarı'],
['market','🛒 Oyuncu Pazarı'],
['trade','🔄 Trade Merkezi'],
['players','👥 Oyuncular'],
['items','💎 Eşyalar'],
['calculators','🧮 Hesaplayıcılar'],
['farm','🌾 Farm Rehberleri'],
['guides','📚 Rehberler'],
['commands','⌨️ Komutlar'],
['events','📅 Etkinlikler'],
['codes','🎟️ Kodlar'],
['giveaway','🎉 Çekilişler'],
['achievements','🏆 Başarımlar'],
['reports','🚨 Bildirimler'],
['discord','💬 Discord'],
['settings','⚙️ Ayarlar'],
['admin','🛡️ Admin']
];

var boxes=[
{id:1,name:'Gizemli Kutu',icon:'🎁',cmd:['RaveXismc','korkunckamyon']},
{id:2,name:'Random Kit Kutusu',icon:'🎒',cmd:['RaveXismc','korkunckamyon']},
{id:3,name:'Kaliteli Kutu',icon:'💎',cmd:['RaveXismc','korkunckamyon']},
{id:4,name:'Kalitesiz Kutu',icon:'🗑️',cmd:['RaveXismc','korkunckamyon']},
{id:5,name:'Random Kutu',icon:'🎲',cmd:['RaveXismc','korkunckamyon']}
];

var trades=[];
var markets=[];
var reports=[];
var scammers=[];

function esc(s){
s=String(s==null?'':s);
return s.replace(/[&<>'"]/g,function(c){
return {
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[c];
});
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify({
boxes:boxes,
trades:trades,
markets:markets,
reports:reports,
scammers:scammers
}));
}catch(e){}
}

function load(){
try{
var x=JSON.parse(localStorage.getItem(KEY)||'null');

if(x){
if(Array.isArray(x.boxes)&&x.boxes.length)boxes=x.boxes;
if(Array.isArray(x.trades))trades=x.trades;
if(Array.isArray(x.markets))markets=x.markets;
if(Array.isArray(x.reports))reports=x.reports;
if(Array.isArray(x.scammers))scammers=x.scammers;
}

}catch(e){}
}

function toast(t){
var e=document.getElementById('toast');
e.textContent=t;
e.style.display='block';

clearTimeout(window.__t);

window.__t=setTimeout(function(){
e.style.display='none';
},2000);
}

window.toast=toast;

function copyText(t){

if(navigator.clipboard){

navigator.clipboard.writeText(t)
.then(function(){
toast('Kopyalandı');
})
.catch(function(){
fallback(t);
});

}else{
fallback(t);
}

}

function fallback(t){

var x=document.createElement('textarea');

x.value=t;
document.body.appendChild(x);
x.select();

try{
document.execCommand('copy');
}catch(e){}

x.remove();

toast('Kopyalandı');
}

window.copyText=copyText;


/* NAVIGATION */

function go(id){

id=String(id||'');

if(id.indexOf('p-')!==0){
id='p-'+id;
}

document.querySelectorAll('.page').forEach(function(p){
p.classList.remove('active');
});

var p=document.getElementById(id);

if(p){
p.classList.add('active');
}

var pageName=id.substring(2);

document.querySelectorAll('[data-page]').forEach(function(b){

b.classList.toggle(
'active',
b.getAttribute('data-page')===pageName
);

});

window.scrollTo(0,0);

}

window.go=go;


/* NAV */

function buildNav(){

var s='';

for(var i=0;i<NAV.length;i++){

s+=
'<button class="nav" data-page="'+NAV[i][0]+'" onclick="go(\'p-'+NAV[i][0]+'\')">'+
NAV[i][1]+
'</button>';

}

document.getElementById('side').innerHTML=s;

var b='';

for(var j=0;j<5;j++){

b+=
'<button data-page="'+NAV[j][0]+'" onclick="go(\'p-'+NAV[j][0]+'\')">'+
'<span>'+NAV[j][1].split(' ')[0]+'</span><br>'+
NAV[j][1].split(' ').slice(1).join(' ')+
'</button>';

}

document.getElementById('bottom').innerHTML=b;

}


/* BOXES */

function renderBoxes(){

var e=document.getElementById('boxes');

var h='';

for(var i=0;i<boxes.length;i++){

h+=
'<div class="card">'+
'<h3>'+esc(boxes[i].icon)+' '+esc(boxes[i].name)+'</h3>'+
'<p class="muted">🎫 Satın almak için ticket açınız.</p>'+
'<button class="btn primary" onclick="showBox('+i+')">Detayları Gör</button>'+
'</div>';

}

e.innerHTML=h||'<div class="empty">Henüz kutu yok.</div>';

}

window.showBox=function(i){

var p=boxes[i];

if(!p)return;

var h=
'<h2>🎁 '+esc(p.name)+'</h2>'+
'<p>🎫 Lütfen ticket açınız.</p>'+
'<p class="muted">Pay komutları:</p>';

for(var j=0;j<p.cmd.length;j++){

h+=
'<div class="actions">'+
'<input value="/Pay '+esc(p.cmd[j])+'" readonly>'+
'<button class="btn primary" onclick="copyText(\'/Pay '+esc(p.cmd[j]).replace(/'/g,"\\'")+'\')">Kopyala</button>'+
'</div><br>';

}

h+='<button class="btn" onclick="closeModal()">Kapat</button>';

openModal(h);

};


/* MODAL */

function openModal(h){

document.getElementById('modalbox').innerHTML=h;

document.getElementById('modal').classList.add('show');

}

window.closeModal=function(){

document.getElementById('modal').classList.remove('show');

};


/* TRADE */

window.tradeForm=function(){

openModal(
'<h2>🔄 Trade İlanı</h2>'+

'<div class="field">'+
'<label>IGN</label>'+
'<input id="ign" placeholder="THEDARKLORD">'+
'</div>'+

'<div class="field">'+
'<label>Discord adı</label>'+
'<input id="disc" placeholder="Dr.yosun">'+
'</div>'+

'<div class="field">'+
'<label>Verdiğin eşya</label>'+
'<input id="give" placeholder="64x Diamond">'+
'</div>'+

'<div class="field">'+
'<label>İstediğin eşya</label>'+
'<input id="want" placeholder="32x Emerald">'+
'</div>'+

'<button class="btn primary" onclick="saveTrade()">Trade İlanı Ekle</button>'
);

};

window.saveTrade=function(){

var a=document.getElementById('ign').value.trim();
var b=document.getElementById('disc').value.trim();
var c=document.getElementById('give').value.trim();
var d=document.getElementById('want').value.trim();

if(!a||!b||!c||!d){
return toast('Tüm alanları doldur');
}

trades.push({
ign:a,
discord:b,
give:c,
want:d,
date:new Date().toLocaleString('tr-TR')
});

save();
closeModal();
renderTrades();
go('trade');

toast('Trade ilanı eklendi');

};

function renderTrades(){

var e=document.getElementById('tradeList');

var h='';

for(var i=0;i<trades.length;i++){

h+=
'<div class="card">'+
'<h3>🔄 '+esc(trades[i].ign)+'</h3>'+
'<p>💬 Discord: <b>'+esc(trades[i].discord)+'</b></p>'+
'<p>📦 Veriyor: '+esc(trades[i].give)+'</p>'+
'<p>🎯 İstiyor: '+esc(trades[i].want)+'</p>'+
'<span class="tag">'+esc(trades[i].date)+'</span>'+
'<br><br>'+
'<button class="btn danger" onclick="deleteTrade('+i+')">Sil</button>'+
'</div>';

}

e.innerHTML=h||'<div class="empty">Henüz trade ilanı yok.</div>';

}

window.deleteTrade=function(i){

if(confirm('Trade silinsin mi?')){

trades.splice(i,1);

save();
renderTrades();

}

};


/* MARKET */

window.marketForm=function(){

openModal(
'<h2>🛒 Pazar İlanı</h2>'+
'<div class="field"><label>Eşya</label>'+
'<input id="mi" placeholder="64x Diamond"></div>'+
'<div class="field"><label>Açıklama</label>'+
'<textarea id="md" placeholder="Ne sattığını veya aradığını yaz."></textarea></div>'+
'<button class="btn primary" onclick="saveMarket()">İlan Ekle</button>'
);

};

window.saveMarket=function(){

var a=document.getElementById('mi').value.trim();
var b=document.getElementById('md').value.trim();

if(!a||!b){
return toast('Alanları doldur');
}

markets.push({
item:a,
desc:b
});

save();
closeModal();
renderMarkets();
go('market');

toast('İlan eklendi');

};

function renderMarkets(){

var e=document.getElementById('marketList');

var h='';

for(var i=0;i<markets.length;i++){

h+=
'<div class="card">'+
'<h3>🛒 '+esc(markets[i].item)+'</h3>'+
'<p>'+esc(markets[i].desc)+'</p>'+
'<button class="btn danger" onclick="deleteMarket('+i+')">Sil</button>'+
'</div>';

}

e.innerHTML=h||'<div class="empty">Henüz pazar ilanı yok.</div>';

}

window.deleteMarket=function(i){

if(confirm('İlan silinsin mi?')){

markets.splice(i,1);

save();
renderMarkets();

}

};


/* REPORT */

window.reportForm=function(){

openModal(
'<h2>🚨 Oyuncu Bildir</h2>'+

'<div class="field">'+
'<label>Oyuncu</label>'+
'<input id="ru">'+
'</div>'+

'<div class="field">'+
'<label>Sebep</label>'+
'<textarea id="rr"></textarea>'+
'</div>'+

'<div class="field">'+
'<label>Kanıt fotoğrafı</label>'+
'<input id="rf" type="file" accept="image/*">'+
'</div>'+

'<button class="btn primary" onclick="saveReport()">Bildir</button>'
);

};

window.saveReport=function(){

var a=document.getElementById('ru').value.trim();
var b=document.getElementById('rr').value.trim();
var f=document.getElementById('rf').files[0];

if(!a||!b){
return toast('Oyuncu ve sebep gerekli');
}

reports.push({
user:a,
reason:b,
file:f?f.name:'Kanıt yok'
});

save();
closeModal();
renderReports();
go('reports');

toast('Bildirim gönderildi');

};


/* SCAMMER */

window.scammerForm=function(){

openModal(
'<h2>⚠️ Scammer Ekle</h2>'+
'<div class="field">'+
'<label>Oyuncu</label>'+
'<input id="su">'+
'</div>'+

'<div class="field">'+
'<label>Sebep</label>'+
'<textarea id="sr"></textarea>'+
'</div>'+

'<button class="btn danger" onclick="saveScammer()">Listeye Ekle</button>'
);

};

window.saveScammer=function(){

var a=document.getElementById('su').value.trim();
var b=document.getElementById('sr').value.trim();

if(!a){
return toast('Oyuncu adı gerekli');
}

scammers.push({
user:a,
reason:b
});

save();
closeModal();
renderReports();
go('reports');

toast('Scammer eklendi');

};


/* REPORT LIST */

function renderReports(){

var e=document.getElementById('reportList');

var h=
'<div class="card">'+
'<h3>⚠️ Scammer Listesi</h3>';

if(scammers.length){

for(var i=0;i<scammers.length;i++){

h+=
'<div style="padding:10px 0;border-bottom:1px solid #2b2140">'+
'<b>'+esc(scammers[i].user)+'</b>'+
'<p>'+esc(scammers[i].reason||'Sebep belirtilmedi')+'</p>'+
'</div>';

}

}else{

h+=
'<div class="empty">'+
'Scammer listesi başlangıçta boş.'+
'</div>';

}

h+='</div>';

h+=
'<div class="card">'+
'<h3>📨 Son Bildirimler</h3>';

if(reports.length){

for(var j=0;j<reports.length;j++){

h+=
'<div style="padding:10px 0;border-bottom:1px solid #2b2140">'+
'<b>'+esc(reports[j].user)+'</b>'+
'<p>'+esc(reports[j].reason)+'</p>'+
'<span class="small">📎 '+esc(reports[j].file)+'</span>'+
'</div>';

}

}else{

h+=
'<div class="empty">'+
'Henüz bildirim yok.'+
'</div>';

}

h+='</div>';

e.innerHTML=h;

}


/* SEARCH */

function filterCards(input,id){

var q=input.value.toLowerCase();

document.querySelectorAll('#'+id+' .card').forEach(function(card){

card.style.display=
card.innerText.toLowerCase().includes(q)
?''
:'none';

});

}

window.filterCards=filterCards;


/* CALCULATORS */

function calcStack(){

var n=parseInt(document.getElementById('stack').value)||0;

document.getElementById('stackOut').textContent=
Math.floor(n/64)+' stack + '+(n%64)+' item';

}

window.calcStack=calcStack;


function calcTime(){

var n=parseInt(document.getElementById('mins').value)||0;

var h=Math.floor(n/60);
var m=n%60;

document.getElementById('timeOut').textContent=
h+' saat '+m+' dakika';

}

window.calcTime=calcTime;


/* ADMIN */

window.adminLogin=function(){

var p=prompt('Admin şifresi:');

if(p==='V6559'){

admin=true;

toast('Admin girişi başarılı');

renderAdmin();

go('admin');

}else{

toast('Şifre yanlış');

}

};


function renderAdmin(){

var e=document.getElementById('adminArea');

if(!admin){

e.innerHTML=
'<div class="empty">Admin panelini kullanmak için giriş yap.</div>';

return;

}

e.innerHTML=
'<div class="card">'+
'<h3>🛡️ Admin Yönetimi</h3>'+
'<button class="btn primary" onclick="addBox()">➕ Kutu Ekle</button> '+
'<button class="btn danger" onclick="clearAll()">🗑️ Verileri Temizle</button>'+
'<hr>'+
'<div id="adminBoxes"></div>'+
'</div>';

var b=document.getElementById('adminBoxes');

var h='';

for(var i=0;i<boxes.length;i++){

h+=
'<div class="card">'+
'<b>'+esc(boxes[i].icon)+' '+esc(boxes[i].name)+'</b>'+
'<br><br>'+
'<button class="btn danger" onclick="removeBox('+i+')">Sil</button>'+
'</div>';

}

b.innerHTML=h;

}

window.renderAdmin=renderAdmin;


/* ADD BOX */

window.addBox=function(){

openModal(
'<h2>➕ Kutu Ekle</h2>'+

'<div class="field">'+
'<label>Kutu adı</label>'+
'<input id="boxName" placeholder="Yeni Kutu">'+
'</div>'+

'<div class="field">'+
'<label>Emoji</label>'+
'<input id="boxIcon" placeholder="🎁">'+
'</div>'+

'<div class="field">'+
'<label>Pay adı 1</label>'+
'<input id="pay1" placeholder="RaveXismc">'+
'</div>'+

'<div class="field">'+
'<label>Pay adı 2</label>'+
'<input id="pay2" placeholder="korkunckamyon">'+
'</div>'+

'<button class="btn primary" onclick="saveBox()">Kaydet</button>'
);

};


window.saveBox=function(){

var name=document.getElementById('boxName').value.trim();
var icon=document.getElementById('boxIcon').value.trim()||'🎁';
var p1=document.getElementById('pay1').value.trim();
var p2=document.getElementById('pay2').value.trim();

if(!name||!p1||!p2){

return toast('Tüm alanları doldur');

}

boxes.push({
id:Date.now(),
name:name,
icon:icon,
cmd:[p1,p2]
});

save();
closeModal();
renderBoxes();
renderAdmin();

toast('Kutu eklendi');

};


window.removeBox=function(i){

if(confirm('Bu kutu silinsin mi?')){

boxes.splice(i,1);

save();
renderBoxes();
renderAdmin();

toast('Kutu silindi');

}

};


/* CLEAR */

window.clearAll=function(){

if(confirm('Tüm site verileri silinsin mi?')){

trades=[];
markets=[];
reports=[];
scammers=[];

save();

renderTrades();
renderMarkets();
renderReports();

toast('Veriler temizlendi');

}

};


/* RESET */

window.resetSite=function(){

if(confirm('Site verileri sıfırlansın mı?')){

localStorage.removeItem(KEY);

location.reload();

}

};


/* START */

load();

buildNav();

renderBoxes();
renderTrades();
renderMarkets();
renderReports();
renderAdmin();

go('home');

})();
</script>
