<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#08080d;
 color:#fff;
 font-family:Arial,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --purple:#8b5cf6;
 --purple2:#6d28d9;
 --bg:#08080d;
 --card:#11111a;
 --card2:#171722;
 --border:#29253b;
 --green:#22c55e;
 --red:#ef4444;
 --yellow:#eab308;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 background:#0b0b12ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--border);
 padding:14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.logo{
 font-size:22px;
 font-weight:900;
 color:#a78bfa;
}
.userbox{
 font-size:13px;
 color:#bbb;
}

.layout{display:flex;min-height:calc(100vh - 60px)}

aside{
 width:240px;
 background:#0b0b12;
 border-right:1px solid var(--border);
 padding:12px;
 position:fixed;
 top:60px;
 bottom:0;
 overflow:auto;
}

.navbtn{
 width:100%;
 padding:11px;
 margin:3px 0;
 background:transparent;
 border:0;
 color:#aaa;
 text-align:left;
 border-radius:9px;
}
.navbtn:hover,.navbtn.active{
 background:#21143c;
 color:#fff;
}

main{
 margin-left:240px;
 width:100%;
 padding:20px;
}

.page{display:none}
.page.active{display:block}

.hero{
 background:linear-gradient(135deg,#171128,#0e0e16);
 border:1px solid var(--border);
 border-radius:18px;
 padding:22px;
 margin-bottom:18px;
}

.hero h1{margin:0 0 8px}
.muted{color:#999}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:14px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:15px;
 padding:17px;
}

.card h3{margin-top:0}

.btn{
 border:1px solid var(--border);
 background:#191922;
 color:#fff;
 border-radius:9px;
 padding:10px 14px;
 margin:4px 2px;
}
.btn:hover{filter:brightness(1.15)}
.primary{background:var(--purple2);border-color:var(--purple)}
.danger{background:#50151b;border-color:#8b2029}
.success{background:#124d2b;border-color:#1f8f4c}
.warning{background:#51420b;border-color:#927c13}

input,textarea,select{
 width:100%;
 background:#090910;
 color:#fff;
 border:1px solid var(--border);
 border-radius:9px;
 padding:11px;
 margin:6px 0 10px;
 outline:none;
}
textarea{min-height:100px;resize:vertical}

.form{
 max-width:650px;
 background:var(--card);
 padding:18px;
 border:1px solid var(--border);
 border-radius:15px;
}

.tag{
 display:inline-block;
 padding:5px 8px;
 border-radius:999px;
 background:#22183c;
 color:#c4b5fd;
 font-size:12px;
 margin:2px;

.announcement{

 border:1px solid #5b21b6;
 padding:12px 15px;
 margin-bottom:15px;
 border-radius:12px;
}

.market-item{
 transition:.15s;
}
.market-item:hover{
 transform:translateY(-2px);
 border-color:#7049b7;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.show{display:flex}

.modalbox{

 border-radius:18px;
 padding:20px;

.color-tabs{

.color-tab{

.color-tab.green{border-color:#188545}
.color-tab.red{border-color:#a52a33}

.count{

.winner{

 text-align:center;

.login-screen{

 padding:25px;

.bottom{

</head>

<script>
/* =========================================================
   VaXeD / KolicHub
   TEK DOSYA SİSTEMİ
   ========================================================= */

const STORAGE_KEY="vaxed_kolichub_full_v3";
const ADMIN_PASSWORD="V6559";

const DEFAULT_DB={
 users:[],
 current:null,

 announcements:[],

 night:{
  yellow:[],
  green:[],
  red:[]
 },

 markets:[],
 trades:[],
 reports:[],
 scammers:[],

 giveaways:[],

 boxes:[
  {id:1,name:"Gizemli Kutu",icon:"🎁",pay:"/pay RaveXismc korkunckamyon"},
  {id:2,name:"Random Kit Kutusu",icon:"🎒",pay:"/pay RaveXismc korkunckamyon"},
  {id:3,name:"Kaliteli Kutu",icon:"💎",pay:"/pay RaveXismc korkunckamyon"},
  {id:4,name:"Kalitesiz Kutu",icon:"🗑️",pay:"/pay RaveXismc korkunckamyon"},
  {id:5,name:"Random Kutu",icon:"🎲",pay:"/pay RaveXismc korkunckamyon"}
 ]
};

let db=loadDB();
let admin=false;
let nightColor="yellow";

function loadDB(){
 try{
  const x=localStorage.getItem(STORAGE_KEY);
  if(!x)return structuredClone(DEFAULT_DB);

  const parsed=JSON.parse(x);

  return {
   ...structuredClone(DEFAULT_DB),
   ...parsed,
   night:{
    ...structuredClone(DEFAULT_DB.night),
    ...(parsed.night||{})
   }
  };
 }catch(e){
  return structuredClone(DEFAULT_DB);
 }
}

function saveDB(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function currentUser(){
 return db.users.find(x=>x.username===db.current);
}

function isLogged(){
 return !!currentUser();
}

function requireLogin(){
 if(!isLogged()){
  showLogin();
  return false;
 }
 return true;
}

function toast(text){
 const el=document.getElementById("toast");
 if(!el)return;

 el.textContent=text;
 el.style.display="block";

 setTimeout(()=>{
  el.style.display="none";
 },2500);
}

function openModal(html){
 document.getElementById("modalBox").innerHTML=html;
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

document.addEventListener("click",e=>{
 if(e.target.id==="modal")closeModal();
});

   LOGIN / REGISTER
   ========================================================= */

function showLogin(){
 document.body.innerHTML=`
 <div class="login-screen">
  <div class="login-box">
   <h1 style="text-align:center;color:#a78bfa">VaXeD</h1>
   <p class="muted" style="text-align:center">KolicHub Topluluk Sistemi</p>

   <div class="tabs">
    <button class="btn primary" id="loginTab" onclick="loginMode()">Giriş</button>
    <button class="btn" onclick="registerMode()">Kayıt</button>
   </div>

   <div id="authForm"></div>
  </div>
 </div>`;

 loginMode();
}

function loginMode(){
 document.getElementById("authForm").innerHTML=`
  <h2>Giriş Yap</h2>

  <input id="loginUser" placeholder="Kullanıcı adı">
  <input id="loginPass" type="password" placeholder="Şifre">

  <button class="btn primary" style="width:100%" onclick="login()">
   Giriş Yap
  </button>
 `;
}

function registerMode(){
 document.getElementById("authForm").innerHTML=`
  <h2>Kayıt Ol</h2>

  <input id="regUser" placeholder="Kullanıcı adı">
  <input id="regPass" type="password" placeholder="Şifre">

  <button class="btn primary" style="width:100%" onclick="register()">
   Hesap Oluştur
  </button>
 `;
}

function register(){
 const username=document.getElementById("regUser").value.trim();
 const password=document.getElementById("regPass").value;

 if(username.length<3){
  toast("Kullanıcı adı en az 3 karakter.");
  return;
 }

 if(password.length<4){
  toast("Şifre en az 4 karakter.");
  return;
 }

 if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase())){
  toast("Bu kullanıcı adı zaten var.");
  return;
 }

 db.users.push({
  username,
  password,
  banned:false,
  createdAt:Date.now()
 });

 db.current=username;
 saveDB();

 render();
 toast("Hesap oluşturuldu.");
}

function login(){
 const username=document.getElementById("loginUser").value.trim();
 const password=document.getElementById("loginPass").value;

 const user=db.users.find(
  x=>x.username.toLowerCase()===username.toLowerCase() &&
     x.password===password
 );

 if(!user){
  toast("Kullanıcı adı veya şifre yanlış.");
  return;
 }

 if(user.banned){
  toast("Bu hesap banlı.");
  return;
 }

 db.current=user.username;
 saveDB();
 render();
}

function go(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));

 const el=document.getElementById("page-"+page);
 if(el)el.classList.add("active");

 document.querySelectorAll(".navbtn,.bottom button")
 .forEach(x=>x.classList.remove("active"));

 document.querySelectorAll(`[data-page="${page}"]`)
 .forEach(x=>x.classList.add("active"));

 if(page==="home")renderHome();
 if(page==="announcements")renderAnnouncements();
 if(page==="night")renderNight();
 if(page==="market")renderMarket();
 if(page==="trade")renderTrade();
 if(page==="players")renderPlayers();
 if(page==="events")renderGiveaways();
 if(page==="reports")renderReports();
 if(page==="scammers")renderScammers();

}

function formatDuration(ms){

 let sec=Math.max(0,Math.floor(ms/1000));

 const days=Math.floor(sec/86400);
 sec%=86400;

 const hours=Math.floor(sec/3600);
 sec%=3600;

 const minutes=Math.floor(sec/60);
 sec%=60;

 if(days)
  return `${days}g ${hours}sa`;

 if(hours)
  return `${hours}sa ${minutes}dk`;

 if(minutes)
  return `${minutes}dk ${sec}sn`;

 return `${sec}sn`;
}

function renderGiveaways(){
 const el=document.getElementById("giveawayList");
 if(!el)return;

 cleanup();

 if(!db.giveaways.length){
  el.innerHTML=
   '<div class="empty">Henüz çekiliş yok.</div>';
  return;
 }

 el.innerHTML=db.giveaways
 .slice()
 .reverse()
 .map(g=>{

   Math.max(0,g.endAt-Date.now());

  const full=
   g.limit &&

  return `
   <div class="card"
        style="margin-bottom:14px">

    <h2>
     🎁 ${esc(g.title)}
    </h2>

     🏆 Ödül:

    </p>

     👥 Kaç kişi girebilecek:
     <b>${g.limit}</b>
    </p>

    <p>
     👤 Katılımcı:
     <b>${g.participants.length}</b>
     / ${g.limit}
    </p>

    <p>
     ⏱️ Süre:
     <b>
      ${
       g.ended
       ?"Çekiliş sona erdi"
       :formatDuration(remaining)
      }
     </b>
    </p>

    ${
     g.conditions
     ?
     `<div class="card">
       📜 Şart:
       ${esc(g.conditions)}
      </div>`
     :""
    }

    ${
     full&&!g.ended
     ?
     `<div class="announcement">
       🔒 Katılımcı limiti doldu.
      </div>`
     :""
    }

    ${
     g.winner
     ?
     `<div class="winner">
       🏆 Kazanan:
       <b>${esc(g.winner)}</b>
      </div>`
     :""
    }

    ${
     !g.ended&&!full
     ?
     `<button class="btn primary"
       onclick="joinGiveaway('${g.id}')">
       🎉 Çekilişe Katıl
      </button>`
     :""
    }

    ${
     admin &&
     g.ended &&
     !g.winner &&
     g.participants.length
     ?
     `<button class="btn success"
       onclick="pickWinner('${g.id}')">
       🏆 Kazananı Seç
      </button>`
     :""
    }

    ${
     admin
     ?
     `<button class="btn danger"
       onclick="deleteGiveaway('${g.id}')">
       Sil
      </button>`
     :""
    }

    <br>

    <small class="muted">
     Oluşturan:
     ${esc(g.createdBy)}
    </small>

   </div>
  `;
 }).join("");
}

function joinGiveaway(id){

 if(!requireLogin())return;

 const g=db.giveaways.find(x=>x.id===id);

 if(!g)return;

 if(g.ended){
  toast("Çekiliş sona erdi.");
  return;
 }

 if(g.limit &&
    g.participants.length>=g.limit){

  toast("Katılımcı limiti doldu.");
  return;
 }

 if(g.participants.includes(db.current)){
  toast("Bu çekilişe zaten katıldın.");
  return;
 }

 g.participants.push(db.current);

 saveDB();

 renderGiveaways();

 toast("Çekilişe katıldın.");
}

function pickWinner(id){

 if(!admin){
  toast("Admin yetkisi gerekli.");
  return;
 }

 const g=db.giveaways.find(x=>x.id===id);

 if(!g||!g.participants.length){
  toast("Katılımcı yok.");
  return;
 }

 const winner=
  g.participants[
   Math.floor(
    Math.random()*g.participants.length
   )
  ];

 g.winner=winner;

 saveDB();

 renderGiveaways();

 toast("Kazanan seçildi: "+winner);
}

function deleteGiveaway(id){

 if(!admin)return;

 if(!confirm("Bu çekiliş silinsin mi?"))
  return;

 db.giveaways=
  db.giveaways.filter(x=>x.id!==id);

 saveDB();

 renderGiveaways();
 renderAdmin();

 toast("Çekiliş silindi.");
}

  </small>

function addReport(){

 const target=
  document.getElementById("rTarget")
  .value.trim();

 const reason=
  document.getElementById("rReason")
  .value.trim();

 const file=
  document.getElementById("rEvidence").files[0];

 if(!target||!reason){
  toast("Oyuncu ve neden gerekli.");
  return;
 }

 if(file &&
    file.size>2*1024*1024){

  toast("Fotoğraf en fazla 2 MB olabilir.");
  return;
 }

 const finish=evidence=>{

  db.reports.push({
   id:uid(),
   target,
   reason,
   evidence:evidence||"",
   reporter:db.current,
   status:"Bekliyor",
   createdAt:Date.now()
  });

  saveDB();

  closeModal();
  renderReports();

  toast("Rapor gönderildi.");
 };

 if(file){

  const reader=new FileReader();

  reader.onload=()=>{
   finish(reader.result);
  };

  reader.readAsDataURL(file);

 }else{

  finish("");
 }
}

    ${esc(r.status)}

    r.evidence

    `

   ${

/* =========================================================
   GIVEAWAY CREATE
   ========================================================= */

function parseDuration(value){

 value=String(value||"")
  .trim()
  .toLowerCase();

 const match=value.match(
  /^(\d+(?:\.\d+)?)\s*(s|sn|m|dk|h|sa|d|g|day|days|hour|hours|minute|minutes)?$/
 );

 if(!match)return 0;

 const number=Number(match[1]);
 const unit=match[2]||"m";

 if(["s","sn"].includes(unit))
  return number*1000;

 if(["m","dk","minute","minutes"].includes(unit))
  return number*60*1000;

 if(["h","sa","hour","hours"].includes(unit))
  return number*60*60*1000;

 if(["d","g","day","days"].includes(unit))
  return number*24*60*60*1000;

 return number*60*1000;
}


function adminCreateGiveaway(){

 if(!admin)return;

 const title=
  document.getElementById("gTitle")
  .value.trim();

 const prize=
  document.getElementById("gPrize")
  .value.trim();

 const time=
  document.getElementById("gTime")
  .value.trim();

 const limit=
  Number(document.getElementById("gLimit").value);

 const conditions=
  document.getElementById("gCondition")
  .value.trim();

 const duration=parseDuration(time);

 if(!title){
  toast("Çekiliş adı gerekli.");
  return;
 }

 if(!prize){
  toast("Ödül gerekli.");
  return;
 }

 if(!duration){
  toast("Süreyi örneğin 1h veya 30m yaz.");
  return;
 }

 if(!limit||limit<1){
  toast("Kaç kişi girebileceğini yaz.");
  return;
 }

 db.giveaways.push({
  id:uid(),
  title,
  prize,
  duration,
  endAt:Date.now()+duration,
  limit,
  conditions,
  participants:[],
  winner:null,
  ended:false,
  createdBy:db.current,
  createdAt:Date.now()
 });

 saveDB();

 renderAdmin();
 renderGiveaways();

 toast("Çekiliş oluşturuldu.");
}

   ========================================================= */

function toggleBan(username){

 if(!admin)return;

 const user=
  db.users.find(x=>x.username===username);

 if(!user)return;

 user.banned=!user.banned;

 /*
  Admin kendi hesabını banlayamasın.
 */

 if(user.username===db.current){

  user.banned=false;

  toast("Kendi hesabını banlayamazsın.");

   ?"Kullanıcı banlandı."

}
