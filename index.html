<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VaXeD | KolicHub</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #08060d;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  background: #100b18;
  border-bottom: 1px solid #2a1740;
  padding: 18px;
}

.logo {
  color: #a855f7;
  font-size: 25px;
  font-weight: bold;
}

.subtitle {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 18px;
}

.hero {
  background: linear-gradient(135deg, #190b29, #0b0810);
  border: 1px solid #452064;
  border-radius: 18px;
  padding: 22px;
}
<script>
function copyIP() {
  navigator.clipboard.writeText("kolichub.net")
    .then(function () {
      alert("✅ IP kopyalandı: kolichub.net");
    })
    .catch(function () {
      alert("📋 Sunucu IP: kolichub.net");
    });
}

function openDiscord() {
  window.open(
    "https://discord.gg/VaXeD",
    "_blank"
  );
}

console.log("VaXeD sitesi aktif!");
</script>

</body>
</html>

.hero h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
}

.server-card {
  background: #0d0913;
  border: 1px solid #302044;
  border-radius: 15px;
  padding: 18px;
  margin-top: 18px;
}

.server-ip {
  color: #c084fc;
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  margin: 4px;
  background: #9333ea;
  color: white;
  font-weight: bold;
}

.section {
  background: #0d0913;
  border: 1px solid #241735;
  border-radius: 15px;
  padding: 18px;
  margin-top: 15px;
}

.section h2 {
  margin-bottom: 12px;
}

@media (max-width: 600px) {
  main {
    padding: 12px;
  }

  button {
    width: 100%;
    margin: 5px 0;
  }
}
</style>
</head>

<body>

  <header>
    <div class="logo">VaXeD</div>
    <div class="subtitle">KolicHub Community</div>
  </header>

  <main>

    <section class="hero">
      <h1>⚡ VaXeD</h1>

      <p>
        KolicHub topluluk sitesine hoş geldin.
      </p>

      <div class="server-card">
        <h2>🎮 Minecraft Sunucusu</h2>

        <div class="server-ip">
          kolichub.net
        </div>

        <button onclick="copyIP()">
          📋 IP Kopyala
        </button>

        <button onclick="openDiscord()">
          💬 Discord
        </button>
      </div>
    </section>

    <section class="section">
      <h2>📢 Duyurular</h2>

      <div id="announcements">
        <p>Henüz duyuru bulunmuyor.</p>
      </div>
    </section>

  </main>
