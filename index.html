<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaXeD | Minecraft Community</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --purple:#8b5cf6;
  --purple2:#a855f7;
  --bg:#08070d;
  --card:#13101c;
  --card2:#100d17;
  --border:#29213a;
  --text:#fff;
  --muted:#aaa2b8;
  --red:#ef4444;
  --green:#22c55e;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#2b1450 0,#08070d 48%);
}

.authBox{
  width:100%;
  max-width:430px;
  background:rgba(19,16,28,.97);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
  box-shadow:0 0 60px rgba(139,92,246,.18);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
}

.logo span,
.brand span,
.hero h1 span{
  color:var(--purple2);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:8px 0 25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  border:1px solid var(--border);
  background:#0d0b14;
  color:#aaa;
  padding:13px;
  border-radius:12px;
}

.tabs button.active{
  background:var(--purple);
  color:#fff;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#c8c0d3;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:#0b0910;
  color:#fff;
  border-radius:12px;
  padding:13px;
  outline:none;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--purple);
}

.primary{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
}

.smallNote{
  color:#777080;
  font-size:12px;
  text-align:center;
  margin-top:15px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,7,13,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.headerInner{
  max-width:1200px;
  margin:auto;
  padding:13px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:25px;
  font-weight:900;
}

.userArea{
  display:flex;
  align-items:center;
  gap:8px;
}

.userName{
  color:#cfc6db;
  font-size:14px;
}

.logout{
  border:1px solid #3a294f;
  background:#171020;
  color:#ddd;
  padding:8px 12px;
  border-radius:9px;
}

/* NAV */

nav{
  max-width:1200px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

nav button{
  white-space:nowrap;
  border:1px solid var(--border);
  background:#100d17;
  color:#aaa;
  padding:9px 12px;
  border-radius:10px;
}

nav button.active{
  color:#fff;
  background:#211333;
  border-color:#673ab7;
}

/* MAIN */

main{
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  padding:30px;
  border:1px solid var(--border);
  border-radius:22px;
  background:
    radial-gradient(circle at right,#281442 0,#130e1b 45%,#0d0b13 100%);
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(32px,7vw,58px);
}

.hero p{
  color:var(--muted);
  margin:12px 0 20px;
  max-width:700px;
  line-height:1.6;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.btn{
  border:1px solid var(--border);
  background:#17121f;
  color:#fff;
  padding:11px 15px;
  border-radius:11px;
}

.btn:hover{
  filter:brightness(1.15);
}

.primaryBtn{
  background:var(--purple);
  border-color:var(--purple);
}

.discord{
  background:#3b1c68;
}

.danger{
  background:#35121a!important;
  border-color:#71303b!important;
  color:#ff9fa9!important;
}

.success{
  background:#10271b!important;
  border-color:#235c38!important;
  color:#92e9ae!important;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.icon{
  font-size:30px;
  margin-bottom:10px;
}

.sectionTitle{
  margin:25px 0 14px;
}

/* SERVER */

.serverCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.ip{
  color:#c084fc;
  font-weight:bold;
  font-size:18px;
  margin-top:5px;
}

/* MARKET */

.marketTabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:18px 0;
}

.marketTabs button{
  white-space:nowrap;
  background:#100d17;
  border:1px solid var(--border);
  color:#aaa;
  padding:10px 14px;
  border-radius:10px;
}

.marketTabs button.active{
  background:#6d28d9;
  color:#fff;
}

.product{
  position:relative;
}

.product .tag{
  position:absolute;
  right:12px;
  top:12px;
  font-size:11px;
  background:#251536;
  color:#c084fc;
  padding:5px 8px;
  border-radius:7px;
}

.product .price{
  margin-top:13px;
  color:#c084fc;
  font-weight:bold;
}

/* FORMS */

.formBox{
  max-width:700px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

/* ADMIN */

.adminBox{
  border:1px solid #4c2874;
  background:#110d18;
  border-radius:18px;
  padding:20px;
}

.adminHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.stat{
  background:#15101e;
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
}

.stat b{
  display:block;
  font-size:27px;
  color:#c084fc;
  margin-top:5px;
}

.adminItem{
  background:#100d16;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  margin-top:10px;
}

.adminItem small{
  color:#8e8798;
}

hr{
  border:0;
  border-top:1px solid var(--border);
  margin:20px 0;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#17121f;
  border:1px solid #4b3268;
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  z-index:100;
  display:none;
  box-shadow:0 10px 30px #0008;
  max-width:90%;
  text-align:center;
}

footer{
  text-align:center;
  color:#655e6d;
  padding:30px 15px;
  border-top:1px solid var(--border);
  margin-top:30px;
}

@media(max-width:600px){

  .headerInner{
    padding:12px;
  }

  .userName{
    display:none;
  }

  main{
    padding:18px 12px 40px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:38px;
  }

  .serverCard{
    align-items:flex-start;
    flex-direction:column;
  }

  .authBox{
    padding:22px;
  }
}
</style>
</head>

<body>
